name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: cargo test --workspace
      - run: cargo check -p wooloo --manifest-path src-tauri/Cargo.toml

  live:
    needs: test
    runs-on: macos-latest
    continue-on-error: false
    env:
      WOOLOO_TEST_SESSION: wooloo-win-ci
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The installer cannot pin a version (installs the latest release); we only log it.
      - name: Install Herdr
        run: |
          curl -fsSL https://herdr.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/herdr" --version
      - name: Start throwaway Herdr server
        run: |
          nohup herdr --session "$WOOLOO_TEST_SESSION" server > "$RUNNER_TEMP/herdr-server.log" 2>&1 &
          for i in $(seq 1 30); do
            if herdr --session "$WOOLOO_TEST_SESSION" workspace create --cwd "$PWD" --label ci; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/herdr-server.log" || true
          exit 1
      - name: Live round-trip test
        run: cargo test -p wooloo-core -- --ignored
      - name: Dump herdr logs
        if: failure()
        run: |
          for f in "$HOME"/.config/herdr/sessions/"$WOOLOO_TEST_SESSION"/*.log "$RUNNER_TEMP/herdr-server.log"; do
            echo "=== $f"; tail -n 200 "$f" || true
          done
      - name: Stop Herdr server
        if: always()
        run: |
          herdr --session "$WOOLOO_TEST_SESSION" server stop || true
          herdr session delete "$WOOLOO_TEST_SESSION" || true

  peer-dispatch:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]   # powershell = Windows PowerShell 5.1 (sshd default shell, must pass); pwsh = 7
    env:
      WOOLOO_PEER_DIAG: "1"          # byte-count diag on cap refusals; remove once green
      WOOLOO_TEST_SHELL: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Peer dispatcher tests (${{ matrix.shell }})
        shell: bash
        run: ${{ matrix.shell }} -NoProfile -File tests/peer-dispatch.tests.ps1
      - name: Allow-list drift check
        shell: bash
        run: python scripts/check-allowlist-drift.py

  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p wooloo-sync --test vectors
      - run: python3 scripts/verify_vectors.py
