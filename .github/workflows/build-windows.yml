name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build wooloo-sync.exe (the PC's sync responder, shipped next to the dispatcher)
        shell: bash
        run: |
          cargo build --release -p wooloo-sync
          cp target/release/wooloo-sync.exe resources/wooloo-sync.exe
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: wooloo-windows-nsis
          path: |
            target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
