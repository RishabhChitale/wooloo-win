[package]
name = "wooloo"
version = "0.1.0"
edition = "2021"
description = "wooloo for Windows: Herdr client"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
wooloo-core = { path = "../crates/wooloo-core" }
wooloo-sync = { path = "../crates/wooloo-sync" }
